<!doctype html><html lang="mai"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · मैथिली समाचार</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><div class="container"><b>मैथिली समाचार · Editorial</b><div><button class="btn btn-light" id="home">Website</button> <button class="btn btn-light" id="logout">Logout</button></div></div></header><main class="container"><div class="panel"><h1>Editorial Dashboard</h1><div id="me"></div><div class="actions"><button class="btn btn-primary" onclick="show('news')">समाचार</button><button class="btn btn-light" onclick="show('cats')">श्रेणी</button><button class="btn btn-light" id="usersBtn" onclick="show('users')">Users</button></div></div><div id="screen"></div></main><div class="modal" id="modal"><div class="modal-box"><h2 id="mtitle">समाचार</h2><div class="form-grid"><div class="full"><label>शीर्षक</label><input class="input" id="title"></div><div><label>English Slug</label><input class="input" id="slug"></div><div><label>श्रेणी</label><select id="cat"></select></div><div class="full"><label>Summary</label><textarea id="summary"></textarea></div><div class="full"><label>Content</label><textarea id="content" style="min-height:260px"></textarea></div><div><label>Image URL</label><input class="input" id="image"></div><div><label>Status</label><select id="status"><option value="draft">Draft</option><option value="review">Review</option><option value="published">Published</option><option value="archived">Archived</option></select></div></div><div class="actions"><button class="btn btn-primary" onclick="saveNews()">Save</button><button class="btn btn-light" onclick="closeModal()">Cancel</button></div><input type="hidden" id="nid"></div></div><script>
const $=s=>document.querySelector(s);async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'include',cache:'no-store',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||'Error');return d}
let user,cats=[];async function init(){const d=await api('/auth');user=d.user;if(!user||!['admin','editor','author'].includes(user.role))return location.href='/login.html';$('#me').textContent=`${user.name} · ${user.role}`;if(user.role==='author')$('#usersBtn').style.display='none';cats=(await api('/categories')).categories||[];show('news')}
function show(tab){if(tab==='news')loadNews();if(tab==='cats')loadCats();if(tab==='users')loadUsers()}
async function loadNews(){const d=await api('/news?status='+encodeURIComponent(user.role==='author'?'review':'draft')+'&limit=50');const published=await api('/news?status=published&limit=50');const rows=[...(d.news||[]),...(published.news||[])].filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);$('#screen').innerHTML=`<div class="panel"><div class="actions"><button class="btn btn-primary" onclick="addNews()">+ नया समाचार</button></div><table class="table"><thead><tr><th>शीर्षक</th><th>Category</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(n=>`<tr><td>${esc(n.title)}</td><td>${esc(n.category_name||'')}</td><td><span class="badge ${n.status==='published'?'green':'orange'}">${n.status}</span></td><td><button class="btn btn-light" onclick="editNews(${n.id})">Edit</button> ${user.role!=='author'?`<button class="btn btn-danger" onclick="delNews(${n.id})">Delete</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addNews(){fillCats();['nid','title','slug','summary','content','image'].forEach(x=>$('#'+x).value='');$('#status').value='draft';$('#modal').classList.add('show')}
async function editNews(id){const n=(await api('/news?id='+id)).news;fillCats();$('#nid').value=n.id;$('#title').value=n.title;$('#slug').value=n.slug;$('#summary').value=n.summary||'';$('#content').value=n.content;$('#image').value=n.image_url||'';$('#cat').value=n.category_id||'';$('#status').value=n.status;$('#modal').classList.add('show')}
function fillCats(){$('#cat').innerHTML='<option value="">—</option>'+cats.map(c=>`<option value="${c.id}">${esc(c.parent_name?'↳ '+c.name:c.name)}</option>`).join('')}
async function saveNews(){try{const b={title:$('#title').value,slug:$('#slug').value,summary:$('#summary').value,content:$('#content').value,image_url:$('#image').value,category_id:$('#cat').value?Number($('#cat').value):null,status:$('#status').value};const id=$('#nid').value;await api('/news'+(id?'?id='+id:''),{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();show('news')}catch(e){alert(e.message)}}async function delNews(id){if(confirm('Delete करब?')){await api('/news?id='+id,{method:'DELETE'});show('news')}}function closeModal(){$('#modal').classList.remove('show')}
async function loadCats(){$('#screen').innerHTML=`<div class="panel"><button class="btn btn-primary" onclick="addCat()">+ नई श्रेणी</button><table class="table"><thead><tr><th>श्रेणी</th><th>Parent</th><th>Slug</th><th>Action</th></tr></thead><tbody>${cats.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.parent_name||'मुख्य')}</td><td>${esc(c.slug)}</td><td><button class="btn btn-danger" onclick="delCat(${c.id})">Delete</button></td></tr>`).join('')}</tbody></table></div>`}async function addCat(){const name=prompt('श्रेणी नाम');if(!name)return;const slug=prompt('English slug');if(!slug)return;const parent=prompt('Parent ID (खाली = मुख्य श्रेणी)')||null;await api('/categories',{method:'POST',body:JSON.stringify({name,slug,parent_id:parent?Number(parent):null})});cats=(await api('/categories')).categories;loadCats()}async function delCat(id){if(confirm('Delete?')){await api('/categories?id='+id,{method:'DELETE'});cats=(await api('/categories')).categories;loadCats()}}
async function loadUsers(){const d=await api('/users');$('#screen').innerHTML=`<div class="panel"><button class="btn btn-primary" onclick="addUser()">+ User</button><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${u.status}</td></tr>`).join('')}</tbody></table></div>`}async function addUser(){const name=prompt('Name');if(!name)return;const email=prompt('Email');if(!email)return;const password=prompt('Password (8+)');if(!password)return;const role=prompt('Role: admin/editor/author/reader','author');await api('/users',{method:'POST',body:JSON.stringify({name,email,password,role})});loadUsers()}
$('#logout').onclick=async()=>{await api('/auth',{method:'POST',body:JSON.stringify({action:'logout'})});location.href='/login.html'};$('#home').onclick=()=>location.href='/';init().catch(e=>alert(e.message));</script></body></html>
