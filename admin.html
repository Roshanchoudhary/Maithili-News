<!doctype html><html lang="mai"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — मैथिली समाचार</title><link rel="stylesheet" href="/style.css"></head><body><header class="header"><div class="container head"><a class="logo" href="/">मैथिली समाचार</a><nav class="dashnav"><button data-tab="news">समाचार</button><button data-tab="categories">श्रेणी</button><button data-tab="comments">टिप्पणी</button><button data-tab="users" id="usersTab">Users</button><button data-tab="plans" id="plansTab">Subscription</button></nav><button id="logout" class="btn btn-danger">Logout</button></div></header><main class="container"><div id="who" class="panel"></div><div id="screen"></div></main><div id="modal" class="modal"><div class="modal-box"><div class="actions between"><h2 id="modalTitle">समाचार</h2><button class="btn btn-light" onclick="closeModal()">✕</button></div><input type="hidden" id="nid"><div class="form-grid"><div class="full"><label>शीर्षक</label><input id="title" class="input"></div><div><label>English Slug</label><input id="slug" class="input"></div><div><label>Category</label><select id="cat" class="input"></select></div><div class="full"><label>Summary</label><textarea id="summary" class="input" rows="3"></textarea></div><div class="full"><label>Content</label><textarea id="content" class="input" rows="12"></textarea></div><div><label>Image URL</label><input id="image" class="input"></div><div><label>Status</label><select id="status" class="input"><option value="draft">Draft</option><option value="review">Review</option><option value="published">Published</option><option value="archived">Archived</option></select></div><div><label>SEO title</label><input id="seoTitle" class="input"></div><div><label>SEO description</label><input id="seoDesc" class="input"></div><div><label><input type="checkbox" id="featured"> Featured</label></div></div><div class="actions"><button id="saveNews" class="btn btn-primary">Save</button></div></div></div><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user,cats=[];
async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'include',cache:'no-store',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({success:false,error:'Invalid server response'}));if(!r.ok||d.success===false)throw Error(d.error||'Request failed');return d}
async function init(){user=(await api('/auth')).user;if(!user||user.role==='reader'){location.href='/login.html';return}$('#who').innerHTML=`<b>${esc(user.name)}</b> · ${esc(user.role)} <span class="muted">${esc(user.email)}</span>`;if(user.role==='author'){$('#usersTab').style.display='none';$('#plansTab').style.display='none'}if(user.role==='editor'){$('#usersTab').style.display='none'}cats=(await api('/categories')).categories;bind();loadNews()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));$('#logout').onclick=async()=>{await api('/auth',{method:'POST',body:JSON.stringify({action:'logout'})});location.href='/'};$('#saveNews').onclick=saveNews}
function show(t){if(t==='news')loadNews();if(t==='categories')loadCats();if(t==='comments')loadComments();if(t==='users')loadUsers();if(t==='plans')loadPlans()}
async function loadNews(){const q=user.role==='author'?'&mine=1':'';const d=await api('/news?status=all&limit=100'+q);const rows=d.news||[];$('#screen').innerHTML=`<div class="panel"><div class="actions between"><h2>समाचार प्रबंधन</h2><button class="btn btn-primary" onclick="addNews()">+ नया समाचार</button></div><div class="table-wrap"><table class="table"><thead><tr><th>शीर्षक</th><th>लेखक</th><th>श्रेणी</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(n=>`<tr><td>${esc(n.title)}</td><td>${esc(n.author_name||'')}</td><td>${esc(n.category_name||'')}</td><td><span class="badge">${esc(n.status)}</span></td><td><button class="btn btn-light" onclick="editNews(${n.id})">Edit</button>${user.role!=='author'?` <button class="btn btn-danger" onclick="delNews(${n.id})">Delete</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`}
function fillCats(){cats=(cats||[]);$('#cat').innerHTML='<option value="">मुख्य</option>'+cats.map(c=>`<option value="${c.id}">${c.parent_id?'↳ ':''}${esc(c.name)}</option>`).join('')}
function addNews(){fillCats();['nid','title','slug','summary','content','image','seoTitle','seoDesc'].forEach(x=>$('#'+x).value='');$('#cat').value='';$('#featured').checked=false;$('#status').value=user.role==='author'?'draft':'published';$('#modalTitle').textContent='नया समाचार';$('#modal').classList.add('show')}
async function editNews(id){const n=(await api('/news?id='+id)).news;fillCats();$('#nid').value=n.id;$('#title').value=n.title;$('#slug').value=n.slug;$('#summary').value=n.summary||'';$('#content').value=n.content;$('#image').value=n.image_url||'';$('#cat').value=n.category_id||'';$('#status').value=n.status;$('#seoTitle').value=n.seo_title||'';$('#seoDesc').value=n.seo_description||'';$('#featured').checked=!!n.featured;$('#modalTitle').textContent='समाचार Edit';$('#modal').classList.add('show')}
async function saveNews(){const id=$('#nid').value,b={title:$('#title').value.trim(),slug:$('#slug').value.trim(),summary:$('#summary').value,content:$('#content').value,image_url:$('#image').value,category_id:$('#cat').value?Number($('#cat').value):null,status:$('#status').value,seo_title:$('#seoTitle').value,seo_description:$('#seoDesc').value,featured:$('#featured').checked};try{await api('/news'+(id?'?id='+id:''),{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();loadNews()}catch(e){alert(e.message)}}
async function delNews(id){if(!confirm('समाचार delete करब?'))return;try{await api('/news?id='+id,{method:'DELETE'});loadNews()}catch(e){alert(e.message)}}function closeModal(){$('#modal').classList.remove('show')}
async function loadCats(){cats=(await api('/categories')).categories;$('#screen').innerHTML=`<div class="panel"><div class="actions between"><h2>श्रेणी / उप-श्रेणी</h2><button class="btn btn-primary" onclick="addCat()">+ नई श्रेणी</button></div><table class="table"><thead><tr><th>नाम</th><th>Parent</th><th>Slug</th><th>Action</th></tr></thead><tbody>${cats.map(c=>`<tr><td>${c.parent_id?'↳ ':''}${esc(c.name)}</td><td>${esc(c.parent_name||'मुख्य')}</td><td>${esc(c.slug)}</td><td>${user.role!=='author'?`<button class="btn btn-danger" onclick="delCat(${c.id})">Delete</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
async function addCat(){const name=prompt('नाम'),slug=prompt('English slug');if(!name||!slug)return;const p=prompt('Parent category ID? खाली = मुख्य');try{await api('/categories',{method:'POST',body:JSON.stringify({name,slug,parent_id:p?Number(p):null})});loadCats()}catch(e){alert(e.message)}}async function delCat(id){if(!confirm('Delete?'))return;try{await api('/categories?id='+id,{method:'DELETE'});loadCats()}catch(e){alert(e.message)}}
async function loadComments(){const d=await api('/comments');$('#screen').innerHTML=`<div class="panel"><h2>टिप्पणी प्रबंधन</h2><table class="table"><thead><tr><th>समाचार</th><th>पाठक</th><th>Comment</th><th>Status</th><th>Action</th></tr></thead><tbody>${d.comments.map(c=>`<tr><td>${esc(c.news_title)}</td><td>${esc(c.user_name)}</td><td>${esc(c.body)}</td><td>${esc(c.status)}</td><td><button class="btn btn-primary" onclick="commentStatus(${c.id},'approved')">Approve</button> <button class="btn btn-danger" onclick="commentStatus(${c.id},'rejected')">Reject</button></td></tr>`).join('')}</tbody></table></div>`}async function commentStatus(id,status){try{await api('/comments?id='+id,{method:'PUT',body:JSON.stringify({status})});loadComments()}catch(e){alert(e.message)}}
async function loadUsers(){const d=await api('/users');$('#screen').innerHTML=`<div class="panel"><div class="actions between"><h2>Users</h2><button class="btn btn-primary" onclick="addUser()">+ User</button></div><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Save</th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><select id="role${u.id}" class="input"><option ${u.role==='reader'?'selected':''}>reader</option><option ${u.role==='author'?'selected':''}>author</option><option ${u.role==='editor'?'selected':''}>editor</option><option ${u.role==='admin'?'selected':''}>admin</option></select></td><td><select id="status${u.id}" class="input"><option ${u.status==='active'?'selected':''}>active</option><option ${u.status==='inactive'?'selected':''}>inactive</option><option ${u.status==='blocked'?'selected':''}>blocked</option></select></td><td><button class="btn btn-light" onclick="saveUser(${u.id})">Save</button></td></tr>`).join('')}</tbody></table></div>`}async function saveUser(id){await api('/users?id='+id,{method:'PUT',body:JSON.stringify({role:$('#role'+id).value,status:$('#status'+id).value})});loadUsers()}async function addUser(){const name=prompt('Name'),email=prompt('Email'),password=prompt('Password (8+)'),role=prompt('Role','author');if(!name||!email||!password)return;try{await api('/users',{method:'POST',body:JSON.stringify({name,email,password,role})});loadUsers()}catch(e){alert(e.message)}}
async function loadPlans(){const d=await api('/plans');$('#screen').innerHTML=`<div class="panel"><h2>Subscription Plans</h2><div class="plans">${d.plans.map(p=>`<div class="plan"><h3>${esc(p.name)}</h3><div class="price">₹${(p.amount_paise/100).toFixed(2)}</div><p>${esc(p.description)}</p><small>${p.duration_days} दिन</small></div>`).join('')}</div></div>`}
init().catch(e=>{document.body.innerHTML='<main class="container"><div class="panel">'+esc(e.message)+'</div></main>'});
</script></body></html>
