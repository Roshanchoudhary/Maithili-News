<!doctype html><html lang="mai"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account</title><link rel="stylesheet" href="/style.css"></head><body><header class="header"><div class="container head"><a class="logo" href="/">मैथिली समाचार</a><div class="user-menu"><button class="btn btn-light" id="logout">Logout</button></div></div></header><main class="container"><div id="app"></div></main><script>
const $=s=>document.querySelector(s);async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'include',...o,headers:{'Content-Type':'application/json'}});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||'Error');return d}async function init(){const u=(await api('/auth')).user;if(!u)return location.href='/login.html';const p=(await api('/plans')).plans||[];const s=(await api('/subscriptions')).subscriptions||[];$('#app').innerHTML=`<div class="panel"><h1>स्वागत, ${u.name}</h1><p class="muted">${u.email}</p></div><h2 class="section-title">Subscription</h2><div class="news-grid">${p.map(x=>`<div class="card" style="padding:18px"><h3>${x.name}</h3><p>${x.description||''}</p><div class="price">₹${(x.amount_paise/100).toFixed(0)}</div><p class="muted">${x.duration_days} दिन</p><button class="btn btn-primary" onclick="buy(${x.id})">सदस्यता लिअ</button></div>`).join('')}</div><h2 class="section-title">My Subscriptions</h2><div class="panel">${s.length?s.map(x=>`<p><b>${x.plan_name}</b> — ${x.status} — ₹${(x.amount_paise/100).toFixed(0)}</p>`).join(''):'अहाँक एखन कोनो subscription नहि अछि।'}</div>`}async function buy(id){try{const d=await api('/subscriptions',{method:'POST',body:JSON.stringify({plan_id:id})});alert(d.message);init()}catch(e){alert(e.message)}}$('#logout').onclick=async()=>{await api('/auth',{method:'POST',body:JSON.stringify({action:'logout'})});location.href='/'};init().catch(e=>alert(e.message));</script></body></html>
