<!doctype html><html lang="mai"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मोर खाता — मैथिली समाचार</title><link rel="stylesheet" href="/style.css"></head><body><header class="header"><div class="container head"><a class="logo" href="/">मैथिली समाचार</a><div class="actions"><a class="btn btn-light" href="/">समाचार</a><button id="logout" class="btn btn-danger">Logout</button></div></div></header><main class="container"><div id="screen" class="panel">लोड भ' रहल अछि...</div></main><script>const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'include',cache:'no-store',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||'Error');return d}async function load(){const u=(await api('/auth')).user;if(!u){location.href='/login.html';return}const [plans,subs,notifs]=await Promise.all([api('/plans'),api('/subscriptions'),api('/notifications')]);$('#screen').innerHTML=`<h1>नमस्कार, ${esc(u.name)}</h1><p class="muted">${esc(u.email)} · ${esc(u.role)}</p><div class="account-grid"><section class="card pad"><h2>Profile</h2><label>नाम</label><input id="name" class="input" value="${esc(u.name)}"><button class="btn btn-primary" id="save">Save</button></section><section class="card pad"><h2>Subscription</h2><div class="plans">${plans.plans.map(p=>`<div class="plan"><h3>${esc(p.name)}</h3><div class="price">₹${(p.amount_paise/100).toFixed(2)}</div><p>${esc(p.description)}</p><button class="btn btn-primary" onclick="subscribe(${p.id})">सदस्यता लिअ</button></div>`).join('')}</div></section></div><section class="card pad"><h2>मोर सदस्यता</h2>${subs.subscriptions.length?subs.subscriptions.map(s=>`<div class="row"><b>${esc(s.plan_name)}</b><span>${esc(s.status)}</span></div>`).join(''):'<p class="muted">अखन कोनो subscription नहि अछि।</p>'}</section><section class="card pad"><h2>Notifications</h2>${notifs.notifications.length?notifs.notifications.map(n=>`<div class="comment"><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div>`).join(''):'<p class="muted">कोनो notification नहि अछि।</p>'}</section>`;$('#save').onclick=async()=>{await api('/profile',{method:'PUT',body:JSON.stringify({name:$('#name').value})});alert('Profile save भ गेल।')}}async function subscribe(id){try{const d=await api('/subscriptions',{method:'POST',body:JSON.stringify({plan_id:id})});alert(d.message)}catch(e){alert(e.message)}}$('#logout').onclick=async()=>{await api('/auth',{method:'POST',body:JSON.stringify({action:'logout'})});location.href='/'};load().catch(e=>$('#screen').textContent=e.message);</script></body></html>
