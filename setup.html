<!doctype html>
<html lang="mai">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>पहिला Admin — मैथिली समाचार</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="auth-page"><div class="auth-box">
<a class="logo" href="/">मैथिली समाचार</a>
<h1>पहिला Admin बनाउ</h1>
<div id="msg" class="msg"></div>
<form id="form">
<label>नाम</label><input id="name" class="input" required autocomplete="name">
<label>Email</label><input id="email" class="input" type="email" required autocomplete="email">
<label>Password</label><input id="password" class="input" type="password" minlength="8" required autocomplete="new-password">
<button id="go" class="btn btn-primary wide" type="submit">Admin बनाउ</button>
</form>
<p><a href="/login.html">Login page पर जाउ</a></p>
<p><a href="/">← वेबसाइट</a></p>
</div></main>
<script>
const $=s=>document.querySelector(s);
async function check(){
 try{const r=await fetch('/api/setup',{headers:{Accept:'application/json'},cache:'no-store'});const d=await r.json();
 if(d.success&&!d.setupAvailable){$('#form').innerHTML='<p>Admin account पहिले सँ बनल अछि। आब Login करू।</p><a class="btn btn-primary wide" href="/login.html">Login करू</a>';}
 }catch(e){$('#msg').textContent='Setup check नहि भ\' सकल।';}
}
$('#form').onsubmit=async e=>{e.preventDefault();const b={name:$('#name').value.trim(),email:$('#email').value.trim(),password:$('#password').value};$('#go').disabled=true;$('#msg').textContent='Admin बनि रहल अछि...';try{const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Admin setup failed');$('#msg').textContent='Admin सफलतापूर्वक बनि गेल।';setTimeout(()=>location.href='/login.html',500);}catch(err){$('#msg').textContent=err.message;$('#go').disabled=false;}};
check();
</script></body></html>
