<!doctype html><html lang="mai"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — मैथिली समाचार</title><link rel="stylesheet" href="/style.css"></head><body><main class="auth-page"><div class="auth-box"><a class="logo" href="/">मैथिली समाचार</a><h1>Reader Registration</h1><div id="msg" class="msg"></div><label>नाम</label><input id="name" class="input" autocomplete="name"><label>Email</label><input id="email" class="input" type="email" autocomplete="email"><label>Password</label><input id="password" class="input" type="password" autocomplete="new-password"><label>Password फेर सँ</label><input id="password2" class="input" type="password" autocomplete="new-password"><button id="go" class="btn btn-primary wide">Register करू</button><p>पहिने सँ account अछि? <a href="/login.html">Login करू</a></p><p><a href="/">← वेबसाइट</a></p></div></main><script>const $=s=>document.querySelector(s);async function go(){const name=$('#name').value.trim(),email=$('#email').value.trim(),password=$('#password').value;if(password!==$('#password2').value){$('#msg').textContent='Password समान नहि अछि।';return}if(password.length<8){$('#msg').textContent='Password कम-से-कम 8 अक्षरक हो।';return}$('#go').disabled=true;$('#msg').textContent='Account बनि रहल अछि...';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({action:'register',name,email,password})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Registration failed');location.href='/account.html'}catch(e){$('#msg').textContent=e.message;$('#go').disabled=false}}$('#go').onclick=go;</script></body></html>
