<!doctype html><html lang="mai"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login / Register</title><link rel="stylesheet" href="/style.css"></head><body><main class="container" style="max-width:520px;padding:45px 0"><div class="panel"><h1>Login / Register</h1><div id="msg" class="muted"></div><div class="form-grid"><div class="full"><label>नाम</label><input class="input" id="name"></div><div class="full"><label>Email</label><input class="input" id="email" type="email"></div><div class="full"><label>Password</label><input class="input" id="password" type="password"></div></div><div class="actions"><button class="btn btn-primary" id="register">Register</button><button class="btn btn-light" id="login">Login</button></div><p><a href="/">← वेबसाइट पर वापस</a></p></div></main><script>
const $=s=>document.querySelector(s);async function go(action){const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,name:$('#name').value,email:$('#email').value,password:$('#password').value})});const d=await r.json();if(!r.ok||!d.success){$('#msg').textContent=d.error||'Error';return}location.href=d.user.role==='reader'?'/account.html':'/admin.html'}$('#register').onclick=()=>go('register');$('#login').onclick=()=>go('login');</script></body></html>
