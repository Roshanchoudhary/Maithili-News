<!doctype html><html lang="mai"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — मैथिली समाचार</title><link rel="stylesheet" href="/style.css"></head><body><main class="auth-page"><div class="auth-box"><a class="logo" href="/">मैथिली समाचार</a><h1>Login</h1><div id="msg" class="msg"></div><label>Email</label><input id="email" class="input" type="email" autocomplete="email"><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password"><button id="go" class="btn btn-primary wide">Login करू</button><p>नया पाठक छी? <a href="/register.html">Register करू</a></p><p><a href="/">← वेबसाइट</a></p></div></main><script>const $=s=>document.querySelector(s);async function go(){const b={action:'login',email:$('#email').value.trim(),password:$('#password').value};$('#go').disabled=true;$('#msg').textContent='Login भ' रहल अछि...';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'include',body:JSON.stringify(b)});const text=await r.text();let d;try{d=JSON.parse(text)}catch(_){throw Error('Server सँ JSON response नहि आयल। /api/auth deployment जाँच करू।')}if(!r.ok||!d.success)throw Error(d.error||'Email अथवा password गलत अछि।');if(d.user.role==='reader')location.href='/account.html';else if(d.user.role==='author')location.href='/admin.html';else location.href='/admin.html'}catch(e){$('#msg').textContent=e.message;$('#go').disabled=false}}$('#go').onclick=go;document.addEventListener('keydown',e=>e.key==='Enter'&&go());</script></body></html>
